<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="t d">
<title id="t">11:48 — Ruth at the kitchen table</title>
<desc id="d">Ruth sits at her kitchen table with her back to a wall screen full of scrolling agent logs. The last line claims an application was submitted successfully. She is not looking at it. She faces the window, listening through an earpiece, tea in hand, and asking, "Has it?"</desc>
<defs>
